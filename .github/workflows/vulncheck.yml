name: vulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 05:17 UTC. A dry run, and a dry run exits 1 when it finds
    # something to fix, so this job goes red when a new advisory lands.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulnmin:
    name: scan this module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Floats on purpose: advisories land in the newest Go release first,
          # and the point of this job is to notice them.
          go-version: stable

      # Dogfooding: govulnmin scans itself. Exit 1 means there is work to do --
      # usually a stdlib advisory in the runner's Go release, which is fixed by
      # bumping the go/toolchain directive. That is a real finding, so the job
      # is allowed to fail; the badge is the reminder.
      - name: govulnmin -n
        run: go run . -n -v

      # Pinned rather than @latest: a scanner is code that runs before anything
      # is verified, so what it does should not change without a commit.
      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
